server {
    listen 80;
    server_name _;
    root /app;
    index index.html;

    # Security: hide nginx version
    server_tokens off;
    # Redirects stay relative, so they work behind a proxy on another host and port.
    absolute_redirect off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # VitePress published the sitemap at /sitemap.xml; Astro writes a sitemap index instead.
    location = /sitemap.xml {
        return 301 /sitemap-index.xml;
    }

    # Per-plugin pages moved to the plugin registry, which reads them from each plugin package.
    location ~ ^/plugins(/|$) {
        return 301 https://registry.moonlit.rs;
    }

    location / {
        # exact matches -> folders (Astro writes /guide/installation/index.html) -> not found.
        # A VitePress-style URL without the trailing slash redirects to the folder.
        try_files $uri $uri/ =404;

        error_page 404 /404.html;
        error_page 403 /404.html;
    }

    # Immutable cache for hashed assets
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # An add_header here replaces the server-level ones, so the security headers repeat.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
